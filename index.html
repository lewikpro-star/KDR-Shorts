<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090909"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>KDR Shorts — test MP4</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#090909;color:#f5f5f5;font:16px -apple-system,BlinkMacSystemFont,Arial,sans-serif;padding:18px 14px 40px}.wrap{max-width:720px;margin:auto}h1{font-size:25px;margin:8px 0 5px}.sub{color:#aaa;margin:0 0 18px;font-size:14px}.panel{background:#171717;border:1px solid #333;border-radius:16px;padding:14px;margin:12px 0}.preview{width:min(100%,320px);aspect-ratio:9/16;background:#222;margin:0 auto 14px;border-radius:12px;overflow:hidden;border:1px solid #444}canvas{width:100%;height:100%;display:block}label{display:block;font-size:14px;color:#ddd;margin:12px 0 6px}textarea,input[type=file]{width:100%;font:inherit;color:#fff;background:#090909;border:1px solid #444;border-radius:10px;padding:11px}textarea{min-height:90px;resize:vertical}button{width:100%;border:0;border-radius:12px;padding:15px;font-weight:700;font-size:16px;margin-top:10px;background:#e31b23;color:white}button:disabled{opacity:.45}#status{white-space:pre-wrap;color:#ddd;font-size:14px;line-height:1.45}.small{color:#aaa;font-size:12px;line-height:1.4}.ok{color:#8ce99a}.bad{color:#ff8787}
</style></head>
<body><div class="wrap"><h1>KAWAŁ DOBREJ ROBOTY</h1><p class="sub">Test eksportu MP4 • 9:16 • 5,85 sekundy</p>
<div class="panel"><div class="preview"><canvas id="stage" width="720" height="1280"></canvas></div>
<label>Tekst dowcipu</label><textarea id="joke">Żona pyta męża:
— Kochanie, co byś zrobił, gdybym wygrała milion?
— Wziąłbym połowę i odszedł.
— Świetnie! Właśnie wygrałam dwanaście złotych. Masz sześć.</textarea>
<label>Zdjęcie / tło (opcjonalnie)</label><input id="bg" type="file" accept="image/*">
<label>Portret do miniaturki i filmu (opcjonalnie)</label><input id="avatar" type="file" accept="image/*">
<button id="render">Sprawdź i wygeneruj MP4</button><p id="status">Podgląd jest rysowany na telefonie. Naciśnij przycisk, aby sprawdzić obsługę MP4 przez Safari.</p><p class="small">To wersja testowa eksportu. Nie zawiera jeszcze OCR, biblioteki GIF-ów ani pełnej biblioteki muzycznej.</p></div>
</div>
<script>
const canvas=document.getElementById('stage'),ctx=canvas.getContext('2d'),joke=document.getElementById('joke'),bgInput=document.getElementById('bg'),avatarInput=document.getElementById('avatar'),statusEl=document.getElementById('status'),btn=document.getElementById('render');let bgImg=null,avatarImg=null;
function loadFile(input,cb){const f=input.files&&input.files[0];if(!f)return;const u=URL.createObjectURL(f),im=new Image();im.onload=()=>{cb(im);draw();URL.revokeObjectURL(u)};im.src=u}
bgInput.onchange=()=>loadFile(bgInput,x=>bgImg=x);avatarInput.onchange=()=>loadFile(avatarInput,x=>avatarImg=x);joke.oninput=draw;
function cover(im,x,y,w,h){const s=Math.max(w/im.width,h/im.height),sw=w/s,sh=h/s,sx=(im.width-sw)/2,sy=(im.height-sh)/2;ctx.drawImage(im,sx,sy,sw,sh,x,y,w,h)}
function draw(t=0){ctx.fillStyle='#101010';ctx.fillRect(0,0,720,1280);if(bgImg){ctx.save();ctx.globalAlpha=.48;cover(bgImg,0,0,720,1280);ctx.restore()}else{const g=ctx.createLinearGradient(0,0,720,1280);g.addColorStop(0,'#191919');g.addColorStop(1,'#050505');ctx.fillStyle=g;ctx.fillRect(0,0,720,1280)}
ctx.strokeStyle='#d71920';ctx.lineWidth=8;ctx.strokeRect(35,35,650,1210);ctx.fillStyle='#d71920';ctx.fillRect(45,55,630,10);ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 42px Arial';ctx.fillText('KAWAŁ DOBREJ ROBOTY',360,125);
const lines=joke.value.split('\n');let y=330;ctx.font='bold 48px Arial';ctx.fillStyle='#fff';for(const line of lines){const words=line.split(' ');let row='';for(const word of words){const test=row?row+' '+word:word;if(ctx.measureText(test).width>590){ctx.fillText(row,360,y);y+=65;row=word}else row=test}if(row){ctx.fillText(row,360,y);y+=75}}
if(avatarImg){ctx.save();ctx.beginPath();ctx.arc(110,1110,66,0,Math.PI*2);ctx.clip();cover(avatarImg,44,1044,132,132);ctx.restore();ctx.strokeStyle='#e21b23';ctx.lineWidth=6;ctx.beginPath();ctx.arc(110,1110,68,0,Math.PI*2);ctx.stroke()}
ctx.fillStyle='#ffc107';ctx.font='bold 36px Arial';ctx.fillText('😂',600,1130);ctx.fillStyle='#ddd';ctx.font='26px Arial';ctx.fillText('@kawal_dobrej_roboty',360,1200)}
draw();
function supportedMp4(){if(!window.MediaRecorder)return null;const types=['video/mp4;codecs="avc1.42E01E,mp4a.40.2"','video/mp4;codecs=avc1','video/mp4'];for(const t of types){try{if(MediaRecorder.isTypeSupported(t))return t}catch(e){}}return null}
btn.onclick=async()=>{btn.disabled=true;statusEl.textContent='Sprawdzam obsługę MP4 w tej przeglądarce…';const mime=supportedMp4();if(!mime){statusEl.innerHTML='Ta wersja Safari nie zgłasza obsługi nagrywania MP4 przez MediaRecorder. Nie zapisuję pliku z innym rozszerzeniem ani nie udaję, że to MP4.\n\nMożemy wtedy sprawdzić alternatywny sposób eksportu.';btn.disabled=false;return}
try{draw();const stream=canvas.captureStream(30);let audioCtx=null;try{audioCtx=new (window.AudioContext||window.webkitAudioContext)();await audioCtx.resume();const dest=audioCtx.createMediaStreamDestination();const osc=audioCtx.createOscillator(),gain=audioCtx.createGain();osc.type='sine';osc.frequency.value=440;gain.gain.value=.018;osc.connect(gain).connect(dest);osc.start();stream.addTrack(dest.stream.getAudioTracks()[0]);}catch(e){}
const chunks=[];const rec=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:4500000});rec.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};rec.onerror=e=>{statusEl.textContent='Błąd nagrywania: '+(e.error?.message||'nieznany');btn.disabled=false};rec.onstop=async()=>{try{const blob=new Blob(chunks,{type:'video/mp4'});if(!blob.size)throw new Error('Pusty plik');const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='KDR-Shorts-test.mp4';document.body.appendChild(a);a.click();a.remove();statusEl.innerHTML='Zakończono. Typ: '+mime+'\nRozmiar: '+(blob.size/1024/1024).toFixed(2)+' MB\nSprawdź w Plikach lub Zdjęciach, czy film otwiera się i ma obraz oraz dźwięk.';setTimeout(()=>URL.revokeObjectURL(url),60000)}catch(e){statusEl.textContent='Nie udało się utworzyć pliku MP4: '+e.message}stream.getTracks().forEach(t=>t.stop());if(audioCtx)audioCtx.close();btn.disabled=false};rec.start();statusEl.textContent='Nagrywam 5,85 sekundy…';setTimeout(()=>{if(rec.state!=='inactive')rec.stop()},5850);
}catch(e){statusEl.textContent='Eksport nie powiódł się: '+e.message;btn.disabled=false}};
</script></body></html>
